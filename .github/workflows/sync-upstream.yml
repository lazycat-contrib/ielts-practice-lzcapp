name: Sync upstream and release

on:
  # Daily upstream check; GitHub Actions cron is UTC (CST = UTC+8)
  schedule:
    - cron: "13 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Sync upstream HEAD, bump version, tag
        env:
          UPSTREAM_REPO: https://github.com/gtiipoi/ielts-practice
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          upstream_sha="$(git ls-remote "${UPSTREAM_REPO}" HEAD | awk '{print $1}')"
          built_sha="$(cat .upstream-sha 2>/dev/null || echo none)"
          if [[ "${upstream_sha}" == "${built_sha}" ]]; then
            echo "Upstream unchanged (${upstream_sha:0:7}); nothing to do"
            exit 0
          fi
          echo "Upstream ${built_sha:0:7} -> ${upstream_sha:0:7}; rebuilding"

          rm -rf /tmp/upstream
          git clone -q "${UPSTREAM_REPO}" /tmp/upstream

          cd /tmp/upstream
          # 与上游 developer/release.sh 一致：发布前重建 js/bundles/*.bundle.js
          # （纯 Node 拼接，无第三方依赖）
          node scripts/build-bundles.mjs

          cd "${GITHUB_WORKSPACE}"
          # 与上游 release.sh 的运行时白名单保持一致：index.html + css + js/bundles + assets
          rm -rf content
          mkdir -p content/js
          cp /tmp/upstream/index.html content/
          cp -r /tmp/upstream/css content/css
          cp -r /tmp/upstream/js/bundles content/js/bundles
          cp -r /tmp/upstream/assets content/assets
          if [ -d /tmp/upstream/ReadingPractice ]; then
            cp -r /tmp/upstream/ReadingPractice content/ReadingPractice
          fi
          echo "${upstream_sha}" > .upstream-sha

          old="$(awk '/^version:/{print $2}' package.yml)"
          IFS=. read -r ma mi pa <<<"${old}"
          new="${ma}.${mi}.$((pa+1))"
          sed -i "s/^version: .*/version: ${new}/" package.yml
          echo "Releasing v${new} from upstream ${upstream_sha:0:7}"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A content .upstream-sha package.yml
          git commit -m "chore: sync upstream ${upstream_sha:0:7} as v${new}"
          git tag "v${new}"
          git push origin "HEAD:main" "refs/tags/v${new}"

          # GITHUB_TOKEN pushes do not trigger other workflows; dispatch explicitly
          gh workflow run lazycat.yml --repo "${GITHUB_REPOSITORY}" --ref "v${new}"
